<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backend Practice</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased relative overflow-x-hidden selection:bg-amber-400 selection:text-slate-950">

    <!-- Ambient Background Glows -->
    <div class="fixed inset-0 pointer-events-none -z-10 overflow-hidden">
        <div class="absolute -top-40 left-1/2 -translate-x-1/2 w-[700px] h-[350px] bg-gradient-to-tr from-amber-500/15 via-orange-500/10 to-transparent blur-[120px] rounded-full"></div>
        <div class="absolute bottom-10 right-10 w-80 h-80 bg-blue-500/5 blur-[100px] rounded-full"></div>
    </div>

    <!-- Header -->
    <header class="sticky top-0 z-50 backdrop-blur-xl bg-slate-950/70 border-b border-slate-800/70">
        <div class="max-w-4xl mx-auto px-6 h-16 flex justify-between items-center">
            
            <!-- Logo -->
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-amber-400 to-amber-200 flex items-center justify-center text-slate-950 font-black shadow-lg shadow-amber-400/20">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 6.75L22.5 12l-5.25 5.25m-10.5 0L1.5 12l5.25-5.25m7.5-3l-4.5 16.5" />
                    </svg>
                </div>
                <h1 class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-white via-slate-100 to-slate-400 bg-clip-text text-transparent">
                    Backend
                </h1>
            </div>

            <!-- Navigation -->
            <nav>
                <a href="#js" class="group flex items-center gap-2 text-xs font-semibold px-3.5 py-1.5 rounded-full bg-slate-900/90 text-slate-300 hover:text-white border border-slate-800 hover:border-amber-400/40 hover:bg-slate-800/80 transition-all duration-300 shadow-sm">
                    <span class="w-2 h-2 rounded-full bg-amber-400 group-hover:scale-125 transition-transform"></span>
                    <span class="capitalize">javascript</span>
                </a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-6 py-12">
        <section id="js" class="relative rounded-2xl bg-gradient-to-b from-slate-900/90 to-slate-900/40 border border-slate-800/80 p-6 sm:p-8 shadow-2xl backdrop-blur-sm overflow-hidden">
            
            <!-- Card Ambient Light -->
            <div class="absolute -top-16 -right-16 w-44 h-44 bg-amber-400/10 rounded-full blur-2xl pointer-events-none"></div>

            <!-- Section Title -->
            <div class="flex items-center justify-between pb-6 mb-6 border-b border-slate-800/80">
                <div class="flex items-center gap-3">
                    <span class="w-8 h-8 rounded-lg bg-amber-400 text-slate-950 font-black text-xs flex items-center justify-center shadow-md shadow-amber-400/20">
                        JS
                    </span>
                    <div class="text-xl font-bold tracking-tight text-white capitalize">
                        javascript
                    </div>
                </div>
                <span class="text-[11px] font-semibold uppercase tracking-wider text-amber-400/90 bg-amber-400/10 border border-amber-400/20 px-2.5 py-1 rounded-full">
                    Modules
                </span>
            </div>

            <!-- Tasks / Day Links -->
            <div>
                <a href="Js/Day1/task.html" class="group inline-flex items-center justify-between w-full sm:w-auto min-w-[220px] px-5 py-3.5 rounded-xl bg-slate-800/60 hover:bg-gradient-to-r hover:from-amber-400 hover:to-amber-300 text-slate-200 hover:text-slate-950 border border-slate-700/70 hover:border-amber-300 font-semibold text-sm transition-all duration-300 shadow-md hover:shadow-xl hover:shadow-amber-400/20 hover:-translate-y-0.5">
                    <div class="flex items-center gap-3">
                        <span class="w-7 h-7 rounded-lg bg-slate-900/80 group-hover:bg-slate-950/20 border border-slate-700/50 group-hover:border-transparent flex items-center justify-center text-xs font-bold text-amber-400 group-hover:text-slate-950 transition-colors">
                            01
                        </span>
                        <span class="tracking-wide">Day 1</span>
                    </div>
                    <svg class="w-4 h-4 ml-4 text-slate-400 group-hover:text-slate-950 transition-all duration-200 group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                    </svg>
                </a>
            </div> 

        </section>
    </main>

</body>
</html>
